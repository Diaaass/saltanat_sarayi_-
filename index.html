      Конвенция <picture> для всех растровых изображений (см. бриф п.1.7):
      Тройной формат: avif → webp → png/jpeg (fallback). Атрибуты width/height — обязательно
      (против CLS). Hero/первый экран — loading="eager" + fetchpriority="high". Остальное —
      loading="lazy". У декоративных img — alt="".

      <picture>
        <source srcset="img/hero.avif" type="image/avif">
        <source srcset="img/hero.webp" type="image/webp">
        <img src="img/hero.jpeg" alt="…" width="1440" height="900" loading="lazy">
      </picture>
    -->
